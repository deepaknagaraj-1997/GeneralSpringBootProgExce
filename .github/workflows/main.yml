name: Java Workflow

on:
   push:
   workflow_dispatch:

jobs:
  java-job-execution:
    runs-on: ubuntu@latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java JDK
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'oracle'
